<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Project Restaurant - cliente</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-light shadow-sm">
            <div class="container-fluid px-4">
                
                <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="index.html">
                 <span class="ms-2">Mi Restaurante</span>
                </a>

                <div class="d-flex justify-content-end align-items-center mb-2">
                    <button id="ordersBtn" class="btn btn-outline-primary position-relative">
                        <i class="bi bi-cart-fill"></i> Mis Ordenes
                        
                    </button>
                </div>

                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>

                
                <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Categorías -->
                <div id="categories" class="d-flex flex-wrap gap-2 ms-lg-4 my-2 my-lg-0"></div>

                <!-- Barra de búsqueda -->
                    <form class="d-flex ms-auto" role="search">
                        <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input
                            type="text"
                            id="searchBar"
                            class="form-control border-start-0"
                            placeholder="Buscar plato..."
                            aria-label="Buscar plato"
                        />
                        </div>
                    </form>
                    <div class="d-flex align-items-center ms-auto me-3">
                        <button id="toggleComandaBtn" class="btn btn-outline-primary position-relative">
                            🧾Orden
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="comandaCount">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
        <div id="comandaPanel" class="comanda-panel shadow-lg">
            <div class="card h-100 border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">🧾 Mi Comanda</h5>
                <button id="closeComandaBtn" class="btn btn-sm btn-light">✕</button>
                </div>

                <div class="card-body overflow-auto" id="orderList">
                <p class="text-muted">No hay platos seleccionados.</p>
                </div>

                <div class="card-footer" id="orderDetailsSection">
                <div class="mb-3">
                    <label for="deliveryType" class="form-label">Forma de entrega:</label>
                    <select id="deliveryType" class="form-select">
                    <option value="1">Delivery</option>
                    <option value="2">Para llevar</option>
                    <option value="3">Comer en restaurante</option>
                    </select>
                </div>

                    <div class="mb-3">
                        <label for="deliveryTo" class="form-label">Mesa o dirección:</label>
                        <input id="deliveryTo" type="text" class="form-control" placeholder="Ej: Mesa 5 o Calle 123" />
                    </div>

                    <div class="mb-3">
                        <label for="orderNotes" class="form-label">Notas generales:</label>
                        <textarea id="orderNotes" class="form-control" rows="2"></textarea>
                    </div>

                    <button id="confirmOrderBtn" class="btn btn-success w-100">
                        Confirmar Comanda
                    </button>
                </div>
            </div>
        </div>
        <main class="container py-4" id="app">
            <div class="row">
            <section class="col-12">
                <div id="dishesGrid" class="row g-4"></div>
            </section>

                    
            </div>   
        </main>
        <!-- Modal placeholder -->
        <div id="modal-root"></div>

       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Contenedor para orders list-->
        <div id="ordersModal" class="modal-backdrop d-none">   
            <div class="orders-panel bg-white shadow-lg p-3 rounded">
                <h5>Comandas Activas</h5>
                <div id="ordersList"></div>
                <button id="closeOrdersBtn" class="btn btn-secondary mt-3 w-100">Cerrar</button>
            </div>
        </div>

    </body>
    <footer>
        <script type="module" src="js/main.js"></script>
    </footer>
</html>
